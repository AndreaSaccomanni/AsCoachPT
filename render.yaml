databases:
  - name: ascoachpt-db
    databaseName: ascoachpt
    user: ascoachpt
    plan: free
    region: frankfurt

services:
  - type: web
    name: ascoachpt
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: ascoachpt-db
          property: connectionString
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
